<?plantuml 1.2026.0?><svg contentStyleType='text/css' data-diagram-type='ACTIVITY' height='741px' preserveAspectRatio='none' style='width:533px;height:741px;background:#FEFEFE;' version='1.1' viewBox='0 0 533 741' width='533px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><title>Procedimento de Auditoria do Contexto do Agente &#8212; 5 Etapas</title><defs/><g><rect fill='#FEFEFE' height='741' style='stroke:none;stroke-width:1;' width='533' x='0' y='0'/><g class='title' data-source-line='4'><text fill='#000000' font-family='sans-serif' font-size='14' font-weight='bold' lengthAdjust='spacing' textLength='490.6426' x='20' y='32.9951'>Procedimento de Auditoria do Contexto do Agente &#8212; 5 Etapas</text></g><ellipse cx='282.0527' cy='57.2969' fill='#222222' rx='10' ry='10' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='193.7422' x='185.1816' y='87.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='255.0703' y='108.4355'>1.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='38.7012' x='270.334' y='108.4355'>Medir</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.7422' x='195.1816' y='122.4043'>`wc -l *.adoc .agents/*.adoc`</text><polygon fill='#F1F1F1' points='223.4729,155.2344,340.6326,155.2344,352.6326,167.2344,340.6326,179.2344,223.4729,179.2344,211.4729,167.2344,223.4729,155.2344' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='117.1597' x='223.4729' y='171.0425'>Total &gt; 1000 lignes ?</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='16.7578' x='194.7151' y='164.6401'>oui</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='352.6326' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='160.4316' x='121.2571' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='140.4316' x='131.2571' y='210.373'>Contexto muito pesado</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='99.5059' x='312.8796' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='79.5059' x='322.8796' y='210.373'>&#9989; Contexto OK</text><ellipse cx='362.6326' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='362.6326' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='179.5625' x='192.2715' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='202.2715' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='144.2988' x='217.5352' y='306.3418'>Identificar o suspeito</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='139.6699' x='214.125' y='320.3105'>arquivo &gt; 20% do total</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='221.3574' x='171.374' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='192.8994' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='163.043' x='208.1631' y='374.2793'>Auditar se&#231;&#227;o por se&#231;&#227;o</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='102.3984' x='230.8535' y='388.248'>Para cada se&#231;&#227;o:</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='201.3574' x='181.374' y='402.2168'>&#8226; J&#225; em outro lugar ? &#8594; duplicado</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='160.6875' x='201.709' y='416.1855'>&#8226; Nunca servido ? &#8594; morto</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='179.9063' x='192.0996' y='430.1543'>&#8226; Informa&#231;&#227;o &#250;nica ? &#8594; cr&#237;tica</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='249.4121' x='157.3467' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='243.0176' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='62.8066' x='258.2813' y='484.123'>Classifier</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='229.4121' x='167.3467' y='498.0918'>&#128993; Duplicados &#8594; para remover doEAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.9121' x='195.0967' y='512.0605'>&#128308; Nunca usado &#8594; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='219.5098' x='172.2979' y='526.0293'>&#128994; Conhecimento &#250;nico &#8594; para manter</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='236.8789' x='163.6133' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdj