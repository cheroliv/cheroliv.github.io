ified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M1011,246.2969 L1011,254.2969 L809.7263,258.2969 L1011,262.2969 L1011,270.2656 A0,0 0 0 0 1011,270.2656 L1942.2598,270.2656 A0,0 0 0 0 1942.2598,270.2656 L1942.2598,256.2969 L1932.2598,246.2969 L1011,246.2969 A0,0 0 0 0 1011,246.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1932.2598,246.2969 L1932.2598,256.2969 L1942.2598,256.2969 L1932.2598,246.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='910.2598' x='1017' y='262.4355'>&#201; o software que executa os modelos. Pode execut&#225;&#8209;los localmente ou delegar &#224; nuvem conforme a tag (:cloud). Ele se autentica usando a chave SSH.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='27' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='171.8398' x='1390.5' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='151.8398' x='1400.5' y='361.4355'>Service d'inf&#233;rence cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='150.3516' x='1400.5' y='375.4043'>Assinatura Pro: 20&#8364;/mois</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='29' id='ent0016'><path d='M1979,336.2969 L1979,369.8922 L1562.7125,365.9277 L1979,377.8922 L1979,416.1406 A0,0 0 0 0 1979,416.1406 L2232.0957,416.1406 A0,0 0 0 0 2232.0957,416.1406 L2232.0957,346.2969 L2222.0957,336.2969 L1979,336.2969 A0,0 0 0 0 1979,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M2222.0957,336.2969 L2222.0957,346.2969 L2232.0957,346.2969 L2222.0957,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' text