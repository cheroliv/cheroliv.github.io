' data-source-line='22' id='ent0011'><path d='M1002,202.2969 L1002,242.7153 L795.1455,254.6462 L1002,250.7153 L1002,282.1406 A0,0 0 0 0 1002,282.1406 L1233.8965,282.1406 A0,0 0 0 0 1233.8965,282.1406 L1233.8965,212.2969 L1223.8965,202.2969 L1002,202.2969 A0,0 0 0 0 1002,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1223.8965,202.2969 L1223.8965,212.2969 L1233.8965,212.2969 L1223.8965,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='152.9238' x='1008' y='218.4355'>&#201; o software que executa</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='201.2695' x='1008' y='232.4043'>os modelos. Ele pode execut&#225;-los</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='210.8965' x='1008' y='246.373'>localmente OU deleg&#225;-los &#224; nuvem</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='170.9766' x='1008' y='260.3418'>dependendo da tag (:cloud).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='189.5508' x='1008' y='274.3105'>Ele se autentica via chave SSH.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='183.002' x='1026.5' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='163.002' x='1036.5' y='361.4355'>Servi&#231;o de infer&#234;ncia cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='147.0586' x='1036.5' y='375.4043'>Assinatura Pro: 20&#8364;/m&#234;s</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='