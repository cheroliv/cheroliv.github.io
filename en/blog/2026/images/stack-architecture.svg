I of vibe coding</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='107.5313' x='237' y='128.4043'>Open source, free</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M484,79.2969 L484,110.2617 L355.1878,116.2971 L484,118.2617 L484,145.1719 A0,0 0 0 0 484,145.1719 L733.709,145.1719 A0,0 0 0 0 733.709,145.1719 L733.709,89.2969 L723.709,79.2969 L484,79.2969 A0,0 0 0 0 484,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M723.709,79.2969 L723.709,89.2969 L733.709,89.2969 L723.709,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='100.248' x='490' y='95.4355'>It's the tool I use</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='138.1816' x='490' y='109.4043'>to code with AI agents.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='228.709' x='490' y='123.373'>It does not provide the AUCUN model.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='197.4727' x='490' y='137.3418'>It's a terminal + an orchestrator.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='167.873' x='525' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='93.4277' x='535' y='255.4355'>Inference client</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='147.873' x='535' y='269.4043'>Installed on my machine</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M887,202.2969 L887,243.2223 L693.3662,254.9622 L887,251.2223 L887,282.1406 A0,0 0 0 0 887,282.1406 L1135.4609,282.1406 A0,0 0 0 0 1135.4609,282.1406 L1135.4609,212.2969 L1125.4609,202.2969 L887,202.2969 A0,0 0 0 0 887,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1125.4609,202.2969 L1125.4609,212.2969 L1135.4609,212.2969 L1125.4609,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='155.5195' x='893' y='218.4355'>It's the software that runs</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='160.3418' x='893' y='232.4043'>the models. It can execute</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='227.4609' x='893' y='246.373'>locally OR delegate them to the cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='155.5137' x='893' y='260.3418'>based on the tag (:cloud).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='169.5703' x='893' y='274.3105'>It authenticates via key SSH</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='183.7578' x='919' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='141.3398' x='929' y='361.4355'>Cloud inference service</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='163.7578' x='929' y='375.4043'>Pro subscription : &#8364;20/mois</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='M1172,336.2969 L1172,367.132 L1103.0703,368.1929 L1172,375.132 L1172,416.1406 A0,0 0 0 0 1172,416.1406 L1415.2988,416.1406 A0,0 0 0 0 1415.2988,416.1406 L1