00;stroke-width:1.5;' x1='509' x2='700.6113' y1='181.2656' y2='181.2656'/><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='178.6113' x='513' y='174.4355'>Ollama (Local Installation)</text></g><g class='cluster' data-qualified-name='OCloud' data-source-line='30' id='ent0013'><path d='M893.5,298.2969 L984.1016,298.2969 A3.75,3.75 0 0 1 986.6016,300.7969 L993.6016,332.2344 L1380.5,332.2344 A2.5,2.5 0 0 1 1383,334.7344 L1383,421.7969 A2.5,2.5 0 0 1 1380.5,424.2969 L893.5,424.2969 A2.5,2.5 0 0 1 891,421.7969 L891,300.7969 A2.5,2.5 0 0 1 893.5,298.2969' fill='none' style='stroke:#000000;stroke-width:1.5;'/><line style='stroke:#000000;stroke-width:1.5;' x1='891' x2='993.6016' y1='332.2344' y2='332.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='89.6016' x='895' y='311.4355'>Ollama Cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='88.5586' x='895.5215' y='325.4043'>(ollama.com)</text></g><g class='entity' data-qualified-name='Dev' data-source-line='7' id='ent0002'><ellipse cx='52.3154' cy='88.7969' fill='#F1F1F1' rx='8' ry='8' style='stroke:#181818;stroke-width:0.5;'/><path d='M52.3154,96.7969 L52.3154,123.7969 M39.3154,104.7969 L65.3154,104.7969 M52.3154,123.7969 L39.3154,138.7969 M52.3154,123.7969 L65.3154,138.7969' fill='none' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='92.6309' x='6' y='151.4355'>Me (Developer)</text></g><g class='entity' data-qualified-name='OC.CLI' data-source-line='10' id='ent0004'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='132.0957' x='227' y='93.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='112.0957' x='237' y='114.4355'>CLI for vibe coding</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='107.5313' x='237' y='128.4043'>Open source, free</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M488,79.2969 L488,110.1295 L359.2693,116.2304 L488,118.1295 L488,145.1719 A0,0 0 0 0 488,145.1719 L714.2012,145.1719 A0,0 0 0 0 714.2012,145.1719 L714.2012,89.2969 L704.2012,79.2969 L488,79.2969 A0,0 0 0 0 488,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M704.2012,79.2969 L704.2012,89.2969 L714.2012,89.2969 L704.2012,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='100.248' x='494' y='95.4355'>It's the tool I use</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='138.1816' x='494' y='109.4043'>to code with AI agents.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='205.2012' x='494' y='123.373'>It does not provide AUCUN model.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='197.4727' x='494' y='137.3418'>It's a terminal + an orchestrator.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='167.873' x='517' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='93.4277' x='527' y='255.4355'>Inference client</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='147.873' x='527' y='269.4043'>Installed on my machine</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M867,202.2969 L867,243.3801 L685.2357,254.8645 L867,251.3801 L867,282.1406 A0,0 0 0 0 867,282.1406 L1115.4609,282.1406 A0,0 0 0 0 1115.4609,282.1406 L1115.4609,212.2969 L1105.4609,202.2969 L867,202.2969 A0,0 0 0 0 867,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1105.4609,202.2969 L1105.4609,212.2969 L1115.4609,212.2969 L1105.4609,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='175.6465' x='873' y='218.4355'>This is the software that runs</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='167.5254' x='873' y='232.4043'>the models. It can run them</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='227.4609' x='873' y='246.373'>locally OR delegate them to the cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='195.0703' x='873' y='260.3418'>depending on the tag (`:cloud`).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.3848' x='873' y='274.3105'>It authenticates via key SSH.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='183.8926' x='899' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='141.3398' x='909' y='361.4355'>Cloud inference service</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='163.8926' x='909' y='375.4043'>Abonnement Pro: &#8364;20/mois</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='M1152,336.2969 L1152,367.3738 L1083.2019,368.3428 L1152,375.3738 L1152,416.1406 A0,0 0 0 0 1152,416.1406 L1375.4063,416.1406 A0,0 0 0 0 1375.4063,416.1406 L1375.4063,346.2969 L1365.4063,336.2969 L1152,336.2969 A0,0 0 0 0 1152,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1365.4063,336.2969 L1365.4063,346.2969 L1375.4063,346.2969 L1365.4063,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='179.584' x='1158' y='352.4355'>This is the inference provider.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='181.5117' x='1158' y='366.4043'>My models with the tag :cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='157.0781' x='1158' y='380.373'>are run on LEURS servers.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='202.4063' x='1158' y='394.3418'>The Pro subscription gives access</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='102.8438' x='1158' y='408.3105'>to higher quotas.</text></g><g class='link' data-entity-1='ent0002' data-entity-2='ent0004' data-link-type='dependency' id='lnk18'><polygon fill='#181818' points='226.6188,117.2969,217.6188,113.2969,221.6188,117.2969,217.6188,121.2969,226.6188,117.2969' style='stroke:#181818;stroke-width:1;'/><path d='M99.203,117.2969 C135.3171,117.2969 180.1957,117.2969 220.6188,117.2969' fill='none' style='stroke:#181818;stroke-width:1;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='88.1309' x='119' y='113.4355'>I type prompts</text></g><g class='link' data-entity-1='ent0004' data-entity-2='ent0009' data-link-type='dependency' id='lnk19'><polygon fill='#181818' points='547.7041,234.1997,541.204,226.8004,543.163,232.1073,537.8561,234.0662,547.7041,234.1997' style='stroke:#181818;stroke-width:1;'/><path d='M346.2556,141.3754 C402.5005,167.2922 485.9942,205.7648 542.2547,231.