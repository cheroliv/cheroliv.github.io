<?plantuml 1.2026.0?><svg contentStyleType='text/css' data-diagram-type='ACTIVITY' height='741px' preserveAspectRatio='none' style='width:372px;height:741px;background:#FEFEFE;' version='1.1' viewBox='0 0 372 741' width='372px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><title>Agent Context Audit Procedure &#8212; 5 Steps</title><defs/><g><rect fill='#FEFEFE' height='741' style='stroke:none;stroke-width:1;' width='372' x='0' y='0'/><g class='title' data-source-line='4'><text fill='#000000' font-family='sans-serif' font-size='14' font-weight='bold' lengthAdjust='spacing' textLength='329.6699' x='20' y='32.9951'>Agent Context Audit Procedure &#8212; 5 Steps</text></g><ellipse cx='186.335' cy='57.2969' fill='#222222' rx='10' ry='10' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='193.7422' x='89.4639' y='87.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='149.7432' y='108.4355'>1.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='57.9199' x='165.0068' y='108.4355'>Measure</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.7422' x='99.4639' y='122.4043'>`wc -l *.adoc .agents/*.adoc`</text><polygon fill='#F1F1F1' points='127.7551,155.2344,244.9148,155.2344,256.9148,167.2344,244.9148,179.2344,127.7551,179.2344,115.7551,167.2344,127.7551,155.2344' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='117.1597' x='127.7551' y='171.0425'>Total &gt; 1000 lignes ?</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='16.7578' x='98.9973' y='164.6401'>oui</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='256.9148' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='130.7832' x='40.3635' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='110.7832' x='50.3635' y='210.373'>Context too heavy</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='92.1641' x='220.8328' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='72.1641' x='230.8328' y='210.373'>&#9989; Context OK</text><ellipse cx='266.9148' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='266.9148' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='178.9063' x='96.8818' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='110.7988' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='135.8086' x='126.0625' y='306.3418'>Identify the suspect</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='158.9063' x='106.8818' y='320.3105'>The file &gt; 20% of the total</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='221.709' x='75.4805' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='97.0645' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='163.2773' x='112.3281' y='374.2793'>Audit section by section</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='106.8223' x='132.9238' y='388.248'>For each section :</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='201.709' x='85.4805' y='402.2168'>&#8226; Already elsewhere? &#8594; duplicate</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='133.3652' x='119.6523' y='416.1855'>&#8226; Never used? &#8594; dead</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='190.7461' x='90.9619' y='430.1543'>&#8226; Unique information? &#8594; critical</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='293.3809' x='39.6445' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='147.2998' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='62.8066' x='162.5635' y='484.123'>Classifier</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='273.3809' x='49.6445' y='498.0918'>&#128993; Duplicates &#8594; to be removed from the EAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='164.2383' x='104.2158' y='512.0605'>&#128308; Never used &#8594; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='177.8789' x='97.3955' y='526.0293'>&#128994; Unique knowledge &#8594; to keep</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='229.3027' x='71.6836' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='153.209' y='579.998'>5.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='50.9883' x='168.4727' y='579.998'>Splitter</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='209.3027' x='81.6836' y='593.9668'>&#128994; &#8594; ESSENTIALS (~50 lines, EAGER)</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='194.7129' x='88.9785' y='607.9355'>&#128993;&#128308; &#8594; encyclopedias/ (cold storage)</text><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='186.916' x='92.877' y='640.7656'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='114.4922' x='127.1816' y='661.9043'>&#9989; Optimized context</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='163.1016' x='106.6914' y='675.873'>without loss of engineering</text><ellipse cx='186.335' cy='719.7031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='186.335' cy='719.7031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='186.335' x2='186.335' y1='67.2969' y2='87.2969'/><polygon fill='#181818' points='182.335,77.2969,186.335,87.2969,190.335,77.2969,186.335,81.2969' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='266.9148' x2='266.9148' y1='223.2031' y2='243.2031'/><polygon fill='#181818' points='262.9148,233.2031,266.9148,243.2031,270.9148,233.2031,266.9148,237.2031' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='115.7551' x2='105.7551' y1='167.2344' y2='167.2344'/><line style='stroke:#181818;stroke-width:1;' x1='105.7551' x2='105.7551' y1='167.2344' y2='189.2344'/><polygon fill='#181818' points='101.7551,179.2344,105.7551,189.2344,109.7551,179.2344,105.7551,183.2344' style='stroke:#181818;stroke-