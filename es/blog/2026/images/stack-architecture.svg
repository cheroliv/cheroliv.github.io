>CLI de vibe coding</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='141.5566' x='262' y='128.4043'>c&#243;digo abierto, gratuito</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M579,79.2969 L579,109.875 L414.23,116.1748 L579,117.875 L579,145.1719 A0,0 0 0 0 579,145.1719 L805.9629,145.1719 A0,0 0 0 0 805.9629,145.1719 L805.9629,89.2969 L795.9629,79.2969 L579,79.2969 A0,0 0 0 0 579,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M795.9629,79.2969 L795.9629,89.2969 L805.9629,89.2969 L795.9629,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='172.6172' x='585' y='95.4355'>Es la herramienta que utilizo</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='191.6953' x='585' y='109.4043'>para programar con agentes IA.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='205.9629' x='585' y='123.373'>No proporciona el modelo AUCUN.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='200.6191' x='585' y='137.3418'>Es un terminal + un orquestador.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='169.1152' x='608' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='124.5059' x='618' y='255.4355'>Cliente de inferencia</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='149.1152' x='618' y='269.4043'>Instalado en mi m&#225;quina</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M975,202.2969 L975,242.8434 L777.3263,254.8841 L975,250.8434 L975,282.1406 A0,0 0 0 0 975,282.1406 L1199.7773,282.1406 A0,0 0 0 0 1199.7773,282.1406 L1199.7773,212.2969 L1189.7773,202.2969 L975,202.2969 A0,0 0 0 0 975,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1189.7773,202.2969 L1189.7773,212.2969 L1199.7773,212.2969 L1189.7773,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='203.7773' x='981' y='218.4355'>Es el software que hace funcionar</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='186.5918' x='981' y='232.4043'>los modelos. Puede ejecutarlos</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='177.1992' x='981' y='246.373'>en local O delegarlos al cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='128.0156' x='981' y='260.3418'>seg&#250;n el tag (:cloud).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='160.7168' x='981' y='274.3105'>Se autentica via clave SSH</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='217.3555' x='979' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='197.3555' x='989' y='361.4355'>Servicio de inferencia en la nube</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='155.584' x='989' y='375.4043'>Suscripci&#243;n Pro: 20&#8364;/mois</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='M1237,336.2969 L1237,367.0772 L1196.0262,369.2124 L1237,375.0772 L1237,416.1406 A0,0 0 0 0 1237,4