14.4355'>CLI de vibe coding</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='131.2031' x='262' y='128.4043'>Open source, gratuito</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M568,79.2969 L568,109.986 L403.403,116.2609 L568,117.986 L568,145.1719 A0,0 0 0 0 568,145.1719 L814.4512,145.1719 A0,0 0 0 0 814.4512,145.1719 L814.4512,89.2969 L804.4512,79.2969 L568,79.2969 A0,0 0 0 0 568,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M804.4512,79.2969 L804.4512,89.2969 L814.4512,89.2969 L804.4512,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='139.5996' x='574' y='95.4355'>C'est l'outil que j'utilise</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='186.6094' x='574' y='109.4043'>pour coder avec des agents IA.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='168.5625' x='574' y='123.373'>Il ne fournit AUCUN mod&#232;le.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='225.4512' x='574' y='137.3418'>C'est un terminal + un orchestrateur.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='169.1152' x='606.5' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='124.5059' x='616.5' y='255.4355'>Cliente de inferencia</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='149.1152' x='616.5' y='269.4043'>Instalado en mi m&#225;quina</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d