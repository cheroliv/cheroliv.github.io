/text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='357.1804' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='206.2695' x='86.7915' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='186.2695' x='96.7915' y='210.373'>&#9888;&#65039; Contexto demasiado pesado</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='140.4277' x='313.061' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='120.4277' x='323.061' y='210.373'>Ready for your text.</text><ellipse cx='383.2749' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='383.2749' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='204.4238' x='184.3887' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='194.3887' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='169.1602' x='209.6523' y='306.3418'>Identificar al sospechoso</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='156.7559' x='208.2227' y='320.3105'>El archivo &gt; 20% del total</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='221.6504' x='175.7754' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='185.7754' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='186.3867' x='201.0391' y='374.2793'>Auditar secci&#243;n por secci&#243;n</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='116.3965' x='228.4023' y='388.248'>Para cada secci&#243;n :</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='196.0137' x='188.5938' y='402.2168'>&#8226; &#191;Ya en otro lugar? &#8594; duplicado</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='163.0957' x='205.0527' y='416.1855'>&#8226; &#191;Nunca usado? &#8594; muerto</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='186.0469' x='193.5771' y='430.1543'>&#8226; &#191;Informaci&#243;n &#250;nica? &#8594; cr&#237;tica</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='234.6758' x='169.2627' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='247.5654' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='62.8066' x='262.8291' y='484.123'>Classifier</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='214.6758' x='179.2627' y='498.0918'>&#128993; Duplicados &#8594; a retirar de la EAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.9121' x='199.6445' y='512.0605'>&#128308; Nunca usado &#8594; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='211.125' x='181.0381' y='526.0293'>&#128994; Conocimiento &#250;nico &#8594; a conservar</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='236.6563' x='168.2725' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='253.4746' y='579.998'>5.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='50.9883' x='268.7383' y='579.998'>Splitter</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='216.6563' x='178.2725' y='593.9668'>&#128994; &#8594; ESSENTIALS (~50 l&#237;neas, EAGER)</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='190.9453' x='191.1279' y='607.9355'>&#128993;&#128308; &#8594; enciclopedias/ (cold storage)</text><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='169.373' x='201.9141' y='640.7656'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='128.8242' x='222.1885' y='661.9043'>&#9989; Contexto optimizado</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='149.373' x='211.9141' y='675.873'>sin p&#233;rdida de ingenier&#237;a</text><ellipse cx='286.6006' cy='719.7031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='286.6006' cy='719.7031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='286.6006' x2='286.6006' y1='67.2969' y2='87.2969'/><polygon fill='#181818' points='282.6006,77.2969,286.6006,87.2969,290.6006,77.2969,286.6006,81.2969' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='383.2749' x2='383.2749' y1='223.2031' y2='243.2031'/><polygon fill='#181818' points='379.2749,233.2031,383.2749,243.2031,387.2749,233.2031,383.2749,237.2031' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='216.0208' x2='189.9263' y1='167.2344' y2='167.2344'/><line style='stroke:#181818;stroke-width:1;' x1='189.9263