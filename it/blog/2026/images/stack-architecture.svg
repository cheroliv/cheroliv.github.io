e coding</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='131.2031' x='246' y='128.4043'>Open source, gratuito</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M569,79.2969 L569,109.8429 L387.1311,116.2911 L569,117.8429 L569,145.1719 A0,0 0 0 0 569,145.1719 L800.1348,145.1719 A0,0 0 0 0 800.1348,145.1719 L800.1348,89.2969 L790.1348,79.2969 L569,79.2969 A0,0 0 0 0 569,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M790.1348,79.2969 L790.1348,89.2969 L800.1348,89.2969 L790.1348,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='138.5215' x='575' y='95.4355'>&#200; lo strumento che uso</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='193.1426' x='575' y='109.4043'>per programmare con agenti IA.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='170.8652' x='575' y='123.373'>NON fornisce alcun modello.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='210.1348' x='575' y='137.3418'>&#200; un terminale + un orchestratore.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='195.3594' x='587' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='109.4414' x='597' y='255.4355'>Client di inferenza</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='175.3594' x='597' y='269.4043'>Installato sulla mia macchina</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M978,202.2969 L978,242.5703 L782.0868,254.4237 L978,250.5703 L978,282.1406 A0,0 0 0 0 978,282.1406 L1193.4023,282.1406 A0,0 0 0 0 1193.4023,282.1406 L1193.4023,212.2969 L1183.4023,202.2969 L978,202.2969 A0,0 0 0 0 978,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1183.4023,202.2969 L1183.4023,212.2969 L1193.4023,212.2969 L1183.4023,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='154.0488' x='984' y='218.4355'>&#200; il software che fa girare</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='135.9844' x='984' y='232.4043'>i modelli. Pu&#242; eseguirli</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='170.2734' x='984' y='246.373'>in locale O delegarli al cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='160.4883' x='984' y='260.3418'>a seconda del tag (:cloud).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='194.4023' x='984' y='274.3105'>Si autentica tramite chiave SSH.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='195.3066' x='988' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='158.3555' x='998' y='361.4355'>Servizio di inferenza cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='175.3066' x='998' y='375.4043'>Abbonamento Pro: 20&#8364;/mese</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='M1230,336.2969 L1230,367.2657 L1183.2158,369.0052 L1230,375.2657 L1230,416.1406 A0,0 0 0 0 1230,416.1406 L1438.3008,41