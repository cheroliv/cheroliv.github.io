<?plantuml 1.2026.0?><svg contentStyleType='text/css' data-diagram-type='ACTIVITY' height='741px' preserveAspectRatio='none' style='width:444px;height:741px;background:#FEFEFE;' version='1.1' viewBox='0 0 444 741' width='444px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><title xmlns=''>Audit-Verfahren des Agentenkontexts &#x2014; 5 Schritte</title><defs xmlns=''/><g xmlns=''><rect fill='#FEFEFE' height='741' style='stroke:none;stroke-width:1;' width='444' x='0' y='0'/><g class='title' data-source-line='4'><text fill='#000000' font-family='sans-serif' font-size='14' font-weight='bold' lengthAdjust='spacing' textLength='401.7344' x='20' y='32.9951'>Audit-Verfahren des Agentenkontexts &#x2014; 5 Schritte</text></g><ellipse cx='235.5391' cy='57.2969' fill='#222222' rx='10' ry='10' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='193.7422' x='138.668' y='87.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='200.0371' y='108.4355'>1.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='55.7402' x='215.3008' y='108.4355'>Mesurer</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.7422' x='148.668' y='122.4043'>`wc -l *.adoc .agents/*.adoc`</text><polygon fill='#F1F1F1' points='176.9592,155.2344,294.1189,155.2344,306.1189,167.2344,294.1189,179.2344,176.9592,179.2344,164.9592,167.2344,176.9592,155.2344' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='117.1597' x='176.9592' y='171.0425'>Total &gt; 1000 lignes ?</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='16.7578' x='148.2014' y='164.6401'>oui</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='306.1189' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='152.2344' x='78.842' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='132.2344' x='88.842' y='210.373'>&#x26a0;&#xfe0f; Contexte trop lourd</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='99.5469' x='266.3455' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='79.5469' x='276.3455' y='210.373'>&#x2705; Contexte OK</text><ellipse cx='316.1189' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='316.1189' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='171.2539' x='149.9121' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='159.9121' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='135.9902' x='175.1758' y='306.3418'>Identifier le suspect</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='149.9414' x='160.5684' y='320.3105'>Le fichier &gt; 20% du total</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='218.9082' x='126.085' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='136.1436' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='183.5273' x='151.4072' y='374.2793'>Auditer section par section</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='129.9844' x='170.5469' y='388.248'>Pour chaque section :</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='161.877' x='154.6006' y='402.2168'>&#x2022; D&#xe9;j&#xe0; ailleurs ? &#x2192; doublon</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='139.7695' x='165.6543' y='416.1855'>&#x2022; Jamais servi ? &#x2192; mort</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='198.9082' x='136.085' y='430.1543'>&#x2022; Information unique ? &#x2192; critique</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='220.5313' x='125.2734' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='196.5039' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='62.8066' x='211.7676' y='484.123'>Classifier</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='196.8809' x='137.0986' y='498.0918'>&#x1f7e1; Doublons &#x2192; &#xe0; retirer de l'EAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='175.0723' x='148.0029' y='512.0605'>&#x1f534; Jamais utilis&#xe9; &#x2192; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='200.5313' x='135.2734' y='526.0293'>&#x1f7e2; Connaissance unique &#x2192; &#xe0; garder</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='236.9199' x='117.0791' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' length