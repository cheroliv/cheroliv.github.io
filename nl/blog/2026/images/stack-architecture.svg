6' y='114.4355'>CLI voor vibe coding</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='117.8027' x='246' y='128.4043'>Open source, gratis</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M540,79.2969 L540,110.0749 L378.2662,116.321 L540,118.0749 L540,145.1719 A0,0 0 0 0 540,145.1719 L797.6191,145.1719 A0,0 0 0 0 797.6191,145.1719 L797.6191,89.2969 L787.6191,79.2969 L540,79.2969 A0,0 0 0 0 540,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M787.6191,79.2969 L787.6191,89.2969 L797.6191,89.2969 L787.6191,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='161.5313' x='546' y='95.4355'>Dit is de tool die ik gebruik</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='179.8242' x='546' y='109.4043'>om te coderen met AI-agents.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='174.2988' x='546' y='123.373'>Het biedt GEEN enkel model.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='236.6191' x='546' y='137.3418'>Het is een terminal + een orchestrator.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='203.8496' x='567' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='93.9434' x='577' y='255.4355'>Inference-client</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='183.8496' x='577' y='269.4043'>Ge&#239;nstalleerd op mijn machine</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d