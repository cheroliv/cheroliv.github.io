<?plantuml 1.2026.0?><svg contentStyleType='text/css' data-diagram-type='ACTIVITY' height='741px' preserveAspectRatio='none' style='width:420px;height:741px;background:#FEFEFE;' version='1.1' viewBox='0 0 420 741' width='420px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><title>Auditprocedure voor Agentcontext &#8212; 5 stappen</title><defs/><g><rect fill='#FEFEFE' height='741' style='stroke:none;stroke-width:1;' width='420' x='0' y='0'/><g class='title' data-source-line='4'><text fill='#000000' font-family='sans-serif' font-size='14' font-weight='bold' lengthAdjust='spacing' textLength='377.2002' x='20' y='32.9951'>Auditprocedure voor Agentcontext &#8212; 5 stappen</text></g><ellipse cx='211.4047' cy='57.2969' fill='#222222' rx='10' ry='10' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='193.7422' x='114.5336' y='87.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='182.5238' y='108.4355'>1.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='42.498' x='197.7875' y='108.4355'>Meten</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.7422' x='124.5336' y='122.4043'>`wc -l *.adoc .agents/*.adoc`</text><polygon fill='#F1F1F1' points='152.8248,155.2344,269.9845,155.2344,281.9845,167.2344,269.9845,179.2344,152.8248,179.2344,140.8248,167.2344,152.8248,155.2344' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='117.1597' x='152.8248' y='171.0425'>Total &gt; 1000 lignes ?</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='16.7578' x='124.067' y='164.6401'>oui</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='281.9845' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='138.1367' x='61.7565' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='118.1367' x='71.7565' y='210.373'>&#9888;&#65039; Te zware context</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='92.1641' x='245.9025' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='72.1641' x='255.9025' y='210.373'>&#9989; Context OK</text><ellipse cx='291.9845' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='291.9845' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='225.8047' x='98.5023' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='118.0677' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='171.4102' x='133.3314' y='306.3418'>Identificeer de verdachte</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='205.8047' x='108.5023' y='320.3105'>Het bestand &gt; 20% van het totaal</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='238.9414' x='91.934' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='101.934' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='203.6777' x='117.1976' y='374.2793'>Sectie voor sectie controleren</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='104.0156' x='159.3969' y='388.248'>Voor elke sectie :</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='132.1934' x='145.308' y='402.2168'>&#8226; Al elders ? &#8594; dubbel</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='150.5215' x='136.1439' y='416.1855'>&#8226; Nooit gebruikt? &#8594; dood</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='183.5039' x='119.6527' y='430.1543'>&#8226; Unieke informatie ? &#8594; kritiek</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='294.0781' x='64.3656' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='153.4203' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='100.7051' x='168.684' y='484.123'>Classificeerder</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='274.0781' x='74.3656' y='498.0918'>&#128993; Dubbelingen &#8594; te verwijderen van de EAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='181.4473' x='120.681' y='512.0605'>&#128308; Nooit gebruikt &#8594; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='181.9395' x='120.4349' y='526.0293'>&#128994; Unieke kennis &#8594; te behouden</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='238.2969' x='92.2562' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='178.2787' y='579.998'>5.<