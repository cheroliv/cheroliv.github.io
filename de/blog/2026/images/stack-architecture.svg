76' y='114.4355'>Vibe-Coding-CLI</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='142.1367' x='276' y='128.4043'>Open Source, kostenlos</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M601,79.2969 L601,109.9511 L428.1641,116.2365 L601,117.9511 L601,145.1719 A0,0 0 0 0 601,145.1719 L852.6777,145.1719 A0,0 0 0 0 852.6777,145.1719 L852.6777,89.2969 L842.6777,79.2969 L601,79.2969 A0,0 0 0 0 601,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M842.6777,79.2969 L842.6777,89.2969 L852.6777,89.2969 L842.6777,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='201.5801' x='607' y='95.4355'>Das ist das Tool, das ich benutze,</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='174.791' x='607' y='109.4043'>um mit KI-Agenten zu coden.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='180.2695' x='607' y='123.373'>Es stellt KEINE Modelle bereit.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='230.6777' x='607' y='137.3418'>Es ist ein Terminal + ein Orchestrator.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='206.5684' x='623.5' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='88.043' x='633.5' y='255.4355'>Inferenz-Client</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='186.5684' x='633.5' y='269.4043'>Auf meiner Maschine installiert</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M1008,246.2969 L1008,254.2969 L830.7304,258.2969 L1008,262.2969 L1008,270.2656 A0,0 0 0 0 1008,270.2656 L2111.9473,270.2656 A0,0 0 0 0 2111.9473,270.2656 L2111.9473,256.2969 L2101.9473,246.2969 L1008,246.2969 A0,0 0 0 0 1008,246.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M2101.9473,246.2969 L2101.9473,256.2969 L2111.9473,256.2969 L2101.9473,246.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='1082.9473' x='1014' y='262.4355'>Dies ist die Software, die die Modelle ausf&#252;hrt. Sie kann diese lokal ausf&#252;hren ODER an die Cloud delegieren, je nach Tag (:cloud). Sie authentifiziert sich &#252;ber einen SSH-Schl&#252;ssel.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='27' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='193.1504' x='1463.5' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='136.2598' x='1473.5' y='361.4355'>Cloud-Inferenz-Service</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.1504' x='1473.5' y='375.4043'>Pro-Abonnement: 20&#8364;/Monat</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='29' id='ent0016'><path d='M2149,336.2969 L2149,370.175 L1656.5523,365.9028 L2149,378.175 L2149,416.1406 A0,0 0 0 0 2149,416.1406 L2402.6934,416.1406 A0,0 0 0 0 2402.6934,416.1406 L2402.6934,346.2969 L2392.6934,336.2969 L2149,336.2969 A0,0 0 0 0 2149,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M2392.6934,336.2969 L2392.6934,346.2969 L2402.6934,346.2969 L2392.6934,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='176.8008' x='2155' y='352.4355'>Das ist der Inferenz-Anbieter.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='219.1348' x='2155' y='366.4043'>Meine Modelle mit dem Tag `:cloud`</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='232.6934' x='2155' y='380.373'>werden auf IHREN Servern ausgef&#252;hrt.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='198.709' x='2155' y='394.3418'>Das Pro-Abonnement gibt Zugriff</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='146.0332' x='2155' y='408.3105'>auf h&#246;here Kontingente.</text></g><g class='link' data-entity-1='ent0002' data-entity-2='ent0004' data-link-type='dependency' id='lnk18'><polygon fill='#181818' points='265.8797,117.2969,256.8797,113.2969,260.8797,117.2969,256.8797,121.2969,265.8797,117.2969' style='stroke:#181818;stroke-width:1;'/><path d='M99.2031,117.2969 C143.7101,117.2969 206.2961,117.2969 259.8797,117.2969' fill='none' style='stroke:#181818;stroke-width:1;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='127.2832' x='119' y='113.4355'>Ich gebe Prompts ein</text></g><g class='link' data-entity-1='ent0004' data-entity-2='ent0009' data-link-type='dependency' id='lnk19'><polygon fill='#181818' points='661.3991,234.1997,654.3646,227.3065,656.7144,232.4523,651.5687,234.802,661.3991,234.1997' style='stroke:#181818;stroke-width:1;'/><path d='M412.551,141.3754 C482.03,167.2922 586.2792,206.1788 655.7775,232.1028' fill='none' style='stroke:#181818;stroke-width:1;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='133.084' x='448' y='150.4355'>Ruft dieses Modell auf</text></g><g class='link' data-entity-1='ent0009' data-entity-2='ent0014' data-link-type='dependency' id='lnk20'><polygon fill='#181818' points='1463.2778,358.5823,1454.