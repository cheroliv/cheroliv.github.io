7'>ARCHIVE : ~100 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='73.7598' x='107.5' y='148.4028'>&#24635;&#35745;&#65306;~300 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='462.9346' x='185.3921' y='148.4028'>actually we changed colon to Chinese again. Let's revert to ascii colon.</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='163.5356'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='35.2866' x='107.5' y='178.6685'>Final:</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='92.7012' x='107.5' y='193.8013'>INDEX : ~50 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='117.0254' x='107.5' y='208.9341'>SESSIONS : ~10 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='118.0029' x='107.5' y='224.0669'>ARCHIVE : ~100 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='101.8481' x='107.5' y='239.1997'>Total : ~300 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='594.6421' x='213.4805' y='239.1997'>Wait we left "Total" unchanged. Should translate Total to Chinese? Likely yes. The phrase "</text><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='138.0742' x='808.1226' y='239.1997'>Total : ~300 lignes</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='1108.9419' x='946.1968' y='239.1997'>" expects translation of Total too. So we translate Total to Chinese word "&#24635;&#35745;" or "&#21512;&#35336;"? Since this is Chinese (zh), likely Simplified Chinese, so "&#24635;&#35745;". Keep the asterisks. So "</text><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='80.209' x='2055.1387' y='239.1997'>&#24635;&#35745; : ~300 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='10.1118' x='2135.3477' y='239.1997'>".</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='254.3325'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='102.0767' x='107.5' y='269.4653'>Thus final lines:</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='284.5981'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='92.7012' x='107.5' y='299.731'>INDEX : ~50 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='117.0254' x='107.5' y='314.8638'>SESSIONS : ~10 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='118.0029' x='107.5' y='329.9966'>ARCHIVE : ~100 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='80.209' x='107.5' y='345.1294'>&#24635;&#35745; : ~300 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='360.2622'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='26.8442' x='107.5' y='375.395'>Yes.</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='390.5278'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='256.4771' x='107.5' y='405.6606'>Check consistency: first three lines had</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' text-decoration='underline' textLength='30.7163' x='368.1094' y='405.6606'>PLTx</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='532.6636' x='402.958' y='405.6606'>: ~number lignes . We translated lignes to &#34892;. For total line we used same pattern.</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='420.7935'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='79.4536' x='107.5' y='435.9263'>Now output.</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='4.1323' x='107.5' y='451.0591'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='58.8809' x='107.5' y='466.1919'>&lt;/think&gt;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='92.7012' x='107.5' y='481.3247'>INDEX : ~50 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='117.0254' x='107.5' y='496.4575'>SESSIONS : ~10 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='118.0029' x='107.5' y='511.5903'>ARCHIVE : ~100 &#34892;</text><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='80.209' x='107.5' y='526.7231'>&#24635;&#35745; : ~300 &#34892;</text></g><g class='entity' data-qualified-name='GMN10' data-source-line='44' id='ent0011'><path d='M106.5,570.9375 L106.5,602.4375 L88.0684,606.4375 L106.5,610.4375 L106.5,641.4688 A0,0 0 0 0 106.5,641.4688 L245.5029,641.4688 A0,0 