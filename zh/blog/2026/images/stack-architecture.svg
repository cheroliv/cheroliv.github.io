.5;' width='71.2227' x='132' y='93.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='51.2227' x='142' y='114.4355'>&#27675;&#22260;&#32534;&#31243; CLI</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='36.0059' x='142' y='128.4043'>&#24320;&#28304;&#12289;&#20813;&#36153;</text></g><g class='entity' data-qualified-name='OC.GMN5' data-source-line='12' id='ent0006'><path d='M286,79.2969 L286,110.8469 L203.0696,116.5752 L286,118.8469 L286,145.1719 A0,0 0 0 0 286,145.1719 L532.4512,145.1719 A0,0 0 0 0 532.4512,145.1719 L532.4512,89.2969 L522.4512,79.2969 L286,79.2969 A0,0 0 0 0 286,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M522.4512,79.2969 L522.4512,89.2969 L532.4512,89.2969 L522.4512,79.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='139.5996' x='292' y='95.4355'>C'est l'outil que j'utilise</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='186.6094' x='292' y='109.4043'>pour coder avec des agents IA.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='168.5625' x='292' y='123.373'>Il ne fournit AUCUN mod&#232;le.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='225.4512' x='292' y='137.3418'>C'est un terminal + un orchestrateur.</text></g><g class='entity' data-qualified-name='OL.Client' data-source-line='20' id='ent0009'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='84.8105' x='366.5' y='234.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='36.0059' x='376.5' y='255.4355'>&#25512;&#29702;&#23458;&#25143;&#31471;</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='64.8105' x='376.5' y='269.4043'>&#24050;&#23433;&#35013;&#22312;&#25105;&#30340;&#26426;&#22120;&#19978;</text></g><g class='entity' data-qualified-name='OL.GMN10' data-source-line='22' id='ent0011'><path d='M646,202.2969 L646,243.406 L451.796,256.3669 L646,251.406 L646,282.1406 A0,0 0 0 0 646,282.1406 L868.7441,282.1406 A0,0 0 0 0 868.7441,282.1406 L868.7441,212.2969 L858.7441,202.2969 L646,202.2969 A0,0 0 0 0 646,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M858.7441,202.2969 L858.7441,212.2969 L868.7441,212.2969 L858.7441,202.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='184.7637' x='652' y='218.4355'>C'est le logiciel qui fait tourner</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='195.0996' x='652' y='232.4043'>les mod&#232;les. Il peut les ex&#233;cuter</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='201.7441' x='652' y='246.373'>en local OU les d&#233;l&#233;guer au cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='123.4688' x='652' y='260.3418'>selon le tag (:cloud).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='160.0957' x='652' y='274.3105'>Il s'authentifie via cl&#233; SSH.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='107.9375' x='703.5' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='36.0059' x='713.5' y='361.4355'>&#20113;&#25512;&#29702;&#26381;&#21153;</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='87.9375' x='713.5' y='375.4043'>&#19987;&#19994;&#29256;&#35746;&#38405;&#65306;20 &#27431;&#20803;/&#26376;</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='M906,336.2969 L906,367.0584 L811.7336,366.7397 L906,375.0584 L906,416.1406 A0,0 0 0 0 906,416.1406 L1136.0273,416.1406 A0,0 0 0 0 1136.0273,416.1406 L1136.0273,346.2969 L1126.0273,336.2969 L906,336.2969 A0,0 0 0 0 906,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1126.0273,336.2969 L1126.0273,346.2969 L1136.0273,346.2969 L1126.0273,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='190.8281' x='912' y='352.4355'>C'est le fournisseur d'inf&#233;rence.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='189.4277' x='912' y='366.4043'>Mes mod&#232;les avec le tag :cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='209.0273' x='912' y='380.373'>sont ex&#233;cut&#233;s sur LEURS serveurs.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='188.9648' x='912' y='394.3418'>L'abonnement Pro donne acc&#232;s</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='148.0371' x='912' y='408.3105'>&#224; des quotas sup&#233;rieurs.</text></g><g class='link' data-entity-1='ent0002' data-entity-2='ent0004' data-link-type='dependency' id='lnk18'><polygon fill='#181818' points='131.7478,117.2969,122.7478,113.2969,126.7478,117.2969,122.7478,121.2969,131.7478,117.2969' style='stroke:#181818;stroke-width:1;'/><path d='M49.16,117.2969 C70.9651,117.2969 99.7137,117.2969 125.7478,117.2969' fill='none' style='stroke:#181818;stroke-width:1;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjus