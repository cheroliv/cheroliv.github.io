<?plantuml 1.2026.0?><svg contentStyleType='text/css' data-diagram-type='ACTIVITY' height='741px' preserveAspectRatio='none' style='width:372px;height:741px;background:#FEFEFE;' version='1.1' viewBox='0 0 372 741' width='372px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><title>Agent Context Audit Procedure &#8212; 5 Steps</title><defs/><g><rect fill='#FEFEFE' height='741' style='stroke:none;stroke-width:1;' width='372' x='0' y='0'/><g class='title' data-source-line='4'><text fill='#000000' font-family='sans-serif' font-size='14' font-weight='bold' lengthAdjust='spacing' textLength='329.6699' x='20' y='32.9951'>Agent Context Audit Procedure &#8212; 5 Steps</text></g><ellipse cx='199.6328' cy='57.2969' fill='#222222' rx='10' ry='10' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='193.7422' x='102.7617' y='87.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='163.041' y='108.4355'>1.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='57.9199' x='178.3047' y='108.4355'>Measure</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='173.7422' x='112.7617' y='122.4043'>`wc -l *.adoc .agents/*.adoc`</text><polygon fill='#F1F1F1' points='141.053,155.2344,258.2126,155.2344,270.2126,167.2344,258.2126,179.2344,141.053,179.2344,129.053,167.2344,141.053,155.2344' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='117.1597' x='141.053' y='171.0425'>Total &gt; 1000 lignes ?</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='16.7578' x='112.2952' y='164.6401'>oui</text><text fill='#000000' font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='270.2126' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='145.3555' x='46.3752' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='125.3555' x='56.3752' y='210.373'>&#9888;&#65039; Context too heavy</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='92.1641' x='234.1306' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='72.1641' x='244.1306' y='210.373'>&#9989; Context OK</text><ellipse cx='280.2126' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='280.2126' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='171.0723' x='114.0967' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='124.0967' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='135.8086' x='139.3604' y='306.3418'>Identify the suspect</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='150.6563' x='124.3047' y='320.3105'>Le file &gt; 20% of the total</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='221.709' x='88.7783' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='110.3623' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='163.2773' x='125.626' y='374.2793'>Audit section by section</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='110.9473' x='144.1592' y='388.248'>Pour each section:</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='201.709' x='98.7783' y='402.2168'>&#8226; Already elsewhere? &#8594; duplicate</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='133.3652' x='132.9502' y='416.1855'>&#8226; Never used? &#8594; dead</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='190.7461' x='104.2598' y='430.1543'>&#8226; Unique information? &#8594; critical</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='243.4414' x='77.9121' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='165.7715' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='52.459' x='181.0352' y='484.123'>Classify</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='223.4414' x='87.9121' y='498.0918'>&#128993; Duplicates &#8594; to remove from EAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='164.2383' x='117.5137' y='512.0605'>&#128308; Never used &#8594; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='177.8789' x='110.6934' y='526.0293'>&#128994; Unique knowledge &#8594; to keep</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='229.3027' x='84.9814' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='166.5068' y='579.998'>5.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='50.9883' x='181.7705' y='579.998'>Splitter</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='209.3027' x='94.9814' y='593.9668'>&#128994; &#8594; ESSENTIALS (~50 lines, EAGER)</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='194.7422' x='102.2617' y='607.9355'>&#128993;&#128308; &#8594; encyclopedies/ (cold storage)</text><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='183.1016' x='108.082' y='640.7656'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='114.4922' x='142.3867' y='661.9043'>&#9989; Optimized context</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='163.1016' x='118.082' y='675.873'>without loss of engineering</text><ellipse cx='199.6328' cy='719.7031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='199.6328' cy='719.7031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='199.6328' x2='199.6328' y1='67.2969' y2='87.2969'/><polygon fill='#181818' points='195.6328,77.2969,199.6328,87.2969,203.6328,77.2969,199.6328,81.2969' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='280.2126' x2='280.2126' y1='223.2031' y2='243.2031'/><polygon fill='#181818' points='276.2126,233.2031,280.2126,243.2031,284.2126,233.2031,280.2126,237.2031' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='129.053' x2='119.053' y1='167.2344' y2='167.2344'/><line style='stroke:#181818;stroke-width:1;' x1='119.053' x2='119.053' y1='167.2344' y2='189.2344'/><polygon fill='#181818' points='115.053,179.2344,119.053,189.2344,123.053,179.2344,119.053,183.2344' style='stroke:#181818