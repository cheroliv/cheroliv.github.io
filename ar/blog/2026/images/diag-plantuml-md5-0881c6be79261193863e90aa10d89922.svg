 font-family='sans-serif' font-size='11' lengthAdjust='spacing' textLength='20.6733' x='270.0867' y='164.6401'>non</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='152.2344' x='42.8098' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='132.2344' x='52.8098' y='210.373'>&#x26a0;&#xfe0f; Contexte trop lourd</text><rect fill='#F1F1F1' height='33.9688' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='99.5469' x='230.3132' y='189.2344'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='79.5469' x='240.3132' y='210.373'>&#x2705; Contexte OK</text><ellipse cx='280.0867' cy='254.2031' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='280.0867' cy='254.2031' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><rect fill='#F1F1F1' height='47.9375' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='171.2539' x='113.8799' y='285.2031'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='123.8799' y='306.3418'>2.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='135.9902' x='139.1436' y='306.3418'>Identifier le suspect</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='149.9414' x='124.5361' y='320.3105'>Le fichier &gt; 20% du total</text><rect fill='#F1F1F1' height='89.8438' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='218.9082' x='90.0527' y='353.1406'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='100.1113' y='374.2793'>3.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='183.5273' x='115.375' y='374.2793'>Auditer section par section</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='129.9844' x='134.5146' y='388.248'>Pour chaque section :</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='161.877' x='118.5684' y='402.2168'>&#x2022; D&#xe9;j&#xe0; ailleurs ? &#x2192; doublon</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='139.7695' x='129.6221' y='416.1855'>&#x2022; Jamais servi ? &#x2192; mort</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='198.9082' x='100.0527' y='430.1543'>&#x2022; Information unique ? &#x2192; critique</text><rect fill='#F1F1F1' height='75.875' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='220.5313' x='89.2412' y='462.9844'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='11.4492' x='160.4717' y='484.123'>4.</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='62.8066' x='175.7354' y='484.123'>Classifier</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='196.8809' x='101.0664' y='498.0918'>&#x1f7e1; Doublons &#x2192; &#xe0; retirer de l'EAGER</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='175.0723' x='111.9707' y='512.0605'>&#x1f534; Jamais utilis&#xe9; &#x2192; cold storage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='200.5313' x='99.2412' y='526.0293'>&#x1f7e2; Connaissance unique &#x2192; &#xe0; garder</text><rect fill='#F1F1F1' height='61.9063' rx='12.5' ry='12.5' style='stroke:#181818;stroke-width:0.5;' width='236.9199' x='81.0469' y='558.8594'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textL