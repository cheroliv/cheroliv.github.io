cloud).</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='160.0957' x='913' y='274.3105'>Il s'authentifie via cl&#233; SSH.</text></g><g class='entity' data-qualified-name='OCloud.Cloud' data-source-line='31' id='ent0014'><rect fill='#F1F1F1' height='47.9375' rx='2.5' ry='2.5' style='stroke:#181818;stroke-width:0.5;' width='142.3613' x='947.5' y='340.2969'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='122.3613' x='957.5' y='361.4355'>&#1582;&#1583;&#1605;&#1577; &#1575;&#1604;&#1575;&#1587;&#1578;&#1583;&#1604;&#1575;&#1604; &#1575;&#1604;&#1587;&#1581;&#1575;&#1576;&#1610;</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='117.1934' x='957.5' y='375.4043'>&#1575;&#1588;&#1578;&#1585;&#1575;&#1603; Pro: 20&#8364;/&#1588;&#1607;&#1585;</text></g><g class='entity' data-qualified-name='OCloud.GMN15' data-source-line='33' id='ent0016'><path d='M1167,336.2969 L1167,367.056 L1089.5772,367.5127 L1167,375.056 L1167,416.1406 A0,0 0 0 0 1167,416.1406 L1397.0273,416.1406 A0,0 0 0 0 1397.0273,416.1406 L1397.0273,346.2969 L1387.0273,336.2969 L1167,336.2969 A0,0 0 0 0 1167,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><path d='M1387.0273,336.2969 L1387.0273,346.2969 L1397.0273,346.2969 L1387.0273,336.2969' fill='#FEFFDD' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='190.8281' x='1173' y='352.4355'>C'est le fournisseur d'inf&#233;rence.</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='189.4277' x='1173' y='366.4043'>Mes mod&#232;les avec le tag :cloud</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='209.0273' x='1173' y='380.373'>sont ex&#233;cut&#233;s sur LEURS serveurs.</text><text fill='#000000' font-family='sa